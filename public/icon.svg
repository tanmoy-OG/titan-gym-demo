<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Athletic Carbon Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#020304" />
    </linearGradient>

    <!-- Lime Ultra-Bright (Key Lit Facet) -->
    <linearGradient id="limeLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7" />
      <stop offset="30%" stop-color="#d9f99d" />
      <stop offset="70%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Lime Midtone (Core Energy Facet) -->
    <linearGradient id="limeMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Lime Deep Chiseled Shadow (Depth Facet) -->
    <linearGradient id="limeShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>

    <!-- High-Performance Athletic Neon Glow -->
    <filter id="athleticGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#a3e635" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#84cc16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Carbon Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#22283a" stroke-width="6" />

  <!-- Neon Border Accent Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#a3e635" stroke-width="2" stroke-opacity="0.3" />

  <!-- Monolithic 3D Chiseled Titan "T" -->
  <g filter="url(#athleticGlow)">
    <!-- Top-Left Crossbar Facet -->
    <polygon points="95,104 265,104 256,146 86,146" fill="url(#limeLit)" />

    <!-- Bottom-Left Crossbar Facet -->
    <polygon points="86,146 256,146 247,188 77,188" fill="url(#limeMid)" />

    <!-- Left Stem Power Facet -->
    <polygon points="189,188 247,188 196,428 138,428" fill="url(#limeLit)" />

    <!-- Top-Right Crossbar Facet -->
    <polygon points="265,104 435,104 426,146 256,146" fill="url(#limeMid)" />

    <!-- Bottom-Right Crossbar Facet -->
    <polygon points="256,146 426,146 417,188 305,188 247,188" fill="url(#limeShadow)" />

    <!-- Right Stem Power Facet -->
    <polygon points="247,188 305,188 254,428 196,428" fill="url(#limeShadow)" />

    <!-- Razor Center Spine Ridge Line -->
    <line x1="265" y1="104" x2="196" y2="428" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85" />

    <!-- Horizontal Crossbar Ridge Line -->
    <line x1="86" y1="146" x2="426" y2="146" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5" />

    <!-- Top Edge Highlight -->
    <line x1="95" y1="104" x2="435" y2="104" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.75" />
  </g>
</svg>
